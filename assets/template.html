<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图解动画工作台</title><style>/*__STYLE__*/</style>
<header><div><div class="badge">FIGURE → MOTION / OFFLINE STUDIO</div><h1 id="title"></h1><p>拖动结构 · 编排讲解 · 播放与导出</p></div><div class="toolbar"><button id="exportJson">导出 JSON</button><label class="file">导入 JSON<input id="importJson" type="file" accept=".json" hidden></label><button id="exportSvg">导出当前 SVG</button><button id="exportCaptions">导出讲解稿</button></div></header>
<main class="layout"><section class="card"><svg id="stage" viewBox="0 0 1100 650" role="img" aria-label="可编辑流程图"></svg><div class="toolbar"><button class="primary" id="play">播放</button><button id="reset">回到开始</button><button id="showAll">全图预览</button></div><input id="seek" type="range" min="0" max="10" step=".01" value="0" aria-label="播放进度"><div class="row"><small id="time"></small><small id="mode"></small></div><h2 id="caption"></h2><p class="status" id="status" role="status"></p></section>
<aside class="card"><h2>结构编辑</h2><label>项目标题<input id="projectTitle"></label><label>当前节点<select id="nodeSelect"></select></label><label>标签<input id="nodeLabel"></label><div class="toolbar"><button id="addNode">添加节点</button><button id="deleteNode">删除节点</button></div><h2>连线</h2><div class="row"><label>起点<select id="fromNode"></select></label><label>终点<select id="toNode"></select></label></div><button id="addEdge">添加连线</button><label>当前连线<select id="edgeSelect"></select></label><button id="deleteEdge">删除连线</button><h2 style="margin-top:20px">讲解步骤</h2><div class="steps" id="steps"></div><div class="toolbar"><button id="addStep">添加步骤</button><button id="deleteStep">删除步骤</button></div><label>旁白／字幕<textarea id="stepCaption"></textarea></label><label>时长（秒）<input id="duration" type="number" min=".2" max="60" step=".2"></label><label>高亮节点 id（逗号分隔）<input id="stepNodes"></label><label>高亮连线 id（逗号分隔）<input id="stepEdges"></label><button id="saveStep">保存步骤</button><small>拖动节点后导出 JSON 保存。编辑结构不会自动推断科学含义。</small></aside></main><footer>原创离线工具 · MIT · 动画采用逐步高亮；首版导出 SVG、JSON 与讲解稿，不包含视频编码或语音合成。</footer>
<script id="project-data" type="application/json">__DATA__</script><script>/*__SCRIPT__*/</script></html>

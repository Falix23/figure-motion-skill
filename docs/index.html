<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图解动画工作台</title><style>*{box-sizing:border-box}body{margin:0;background:#101522;color:#e8edf8;font:15px/1.5 system-ui,-apple-system,sans-serif}header{padding:24px 32px;background:#171e30;border-bottom:1px solid #303b54;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{font-size:23px;margin:0}h2{font-size:17px;margin:0 0 14px}p{margin:6px 0;color:#aab8d2}.badge{font-size:11px;letter-spacing:.12em;color:#85b5ff}.layout{padding:24px;max-width:1500px;margin:auto;display:grid;grid-template-columns: minmax(0,1fr) 340px;gap:20px}.card{background:#192236;border:1px solid #303d58;border-radius:16px;padding:20px;min-width:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button,.file{background:#293752;color:#eef4ff;border:1px solid #405271;border-radius:8px;padding:9px 13px;cursor:pointer;font:inherit}button:hover,.file:hover{background:#354c73}button.primary{background:#3669e8;border-color:#5f8eff}input,select,textarea{background:#0f1727;color:#eef4ff;border:1px solid #405271;border-radius:7px;padding:8px;font:inherit;max-width:100%}input[type=range]{padding:0;width:100%;accent-color:#71a3ff}label{display:block;margin:10px 0;color:#bfcee8;font-size:13px}label input:not([type=range]):not([type=checkbox]),label select,label textarea{display:block;width:100%;margin-top:4px}textarea{width:100%;min-height:75px}svg{display:block;width:100%;height:auto;touch-action:none}small{color:#9badcb}.status{color:#a9c6ff;min-height:25px}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.stat{background:#111a2c;padding:12px 18px;border-radius:10px;flex:1}.stat strong{display:block;font-size:21px;color:#94c8ff}.steps{display:grid;gap:8px;margin-top:12px}.step{padding:10px;border:1px solid #3c4c67;border-radius:8px;cursor:pointer}.step.active{background:#284777;border-color:#80acff}details{margin-top:14px}footer{padding:12px 24px 24px;color:#8fa1c0;font-size:12px}.hidden{display:none}@media(max-width:900px){.layout{grid-template-columns:1fr;padding:12px}header{padding:18px}.card{padding:14px}}
[hidden]{display:none!important}.layout{align-items:start}.toolbar>.file{margin:0;display:inline-flex;align-items:center}.toolbar{align-items:center}
</style>
<header><div><div class="badge">FIGURE → MOTION / OFFLINE STUDIO</div><h1 id="title"></h1><p>拖动结构 · 编排讲解 · 播放与导出</p></div><div class="toolbar"><button id="exportJson">导出 JSON</button><label class="file">导入 JSON<input id="importJson" type="file" accept=".json" hidden></label><button id="exportSvg">导出当前 SVG</button><button id="exportCaptions">导出讲解稿</button></div></header>
<main class="layout"><section class="card"><svg id="stage" viewBox="0 0 1100 650" role="img" aria-label="可编辑流程图"></svg><div class="toolbar"><button class="primary" id="play">播放</button><button id="reset">回到开始</button><button id="showAll">全图预览</button></div><input id="seek" type="range" min="0" max="10" step=".01" value="0" aria-label="播放进度"><div class="row"><small id="time"></small><small id="mode"></small></div><h2 id="caption"></h2><p class="status" id="status" role="status"></p></section>
<aside class="card"><h2>结构编辑</h2><label>项目标题<input id="projectTitle"></label><label>当前节点<select id="nodeSelect"></select></label><label>标签<input id="nodeLabel"></label><div class="toolbar"><button id="addNode">添加节点</button><button id="deleteNode">删除节点</button></div><h2>连线</h2><div class="row"><label>起点<select id="fromNode"></select></label><label>终点<select id="toNode"></select></label></div><button id="addEdge">添加连线</button><label>当前连线<select id="edgeSelect"></select></label><button id="deleteEdge">删除连线</button><h2 style="margin-top:20px">讲解步骤</h2><div class="steps" id="steps"></div><div class="toolbar"><button id="addStep">添加步骤</button><button id="deleteStep">删除步骤</button></div><label>旁白／字幕<textarea id="stepCaption"></textarea></label><label>时长（秒）<input id="duration" type="number" min=".2" max="60" step=".2"></label><label>高亮节点 id（JSON 数组）<input id="stepNodes"></label><label>高亮连线 id（JSON 数组）<input id="stepEdges"></label><button id="saveStep">保存步骤</button><small>拖动节点后导出 JSON 保存。编辑结构不会自动推断科学含义。</small></aside></main><footer>原创离线工具 · MIT · 动画采用逐步高亮；首版导出 SVG、JSON 与讲解稿，不包含视频编码或语音合成。</footer>
<script id="project-data" type="application/json">{"title": "从输入到检索增强回答", "nodes": [{"id": "question", "label": "用户问题", "x": 50, "y": 245}, {"id": "retrieve", "label": "检索相关资料", "x": 300, "y": 245}, {"id": "context", "label": "问题与资料组合", "x": 550, "y": 245}, {"id": "answer", "label": "生成有依据的回答", "x": 800, "y": 245}], "edges": [{"id": "e1", "from": "question", "to": "retrieve"}, {"id": "e2", "from": "retrieve", "to": "context"}, {"id": "e3", "from": "context", "to": "answer"}], "steps": [{"caption": "从用户问题开始，明确需要寻找的信息。", "duration": 3, "nodes": ["question"], "edges": []}, {"caption": "根据问题检索相关资料。", "duration": 3, "nodes": ["retrieve"], "edges": ["e1"]}, {"caption": "将相关资料与原问题组合成上下文。", "duration": 3, "nodes": ["context"], "edges": ["e2"]}, {"caption": "模型结合上下文生成回答；检索本身不保证回答正确。", "duration": 4, "nodes": ["answer"], "edges": ["e3"]}]}</script><script>'use strict';
let data=JSON.parse(document.getElementById('project-data').textContent), selected=data.nodes[0].id, stepIndex=0, seconds=0, playing=false, all=false, last=0, drag=null;
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
function svg(tag,attrs={},text){const n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);if(text!==undefined)n.textContent=text;return n}
function download(name,text,type='application/json'){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function total(){return data.steps.reduce((s,x)=>s+x.duration,0)}
function currentStep(t=seconds){let n=0;for(let i=0;i<data.steps.length;i++){n+=data.steps[i].duration;if(t<n)return i}return data.steps.length-1}
function status(s){$('status').textContent=s}
function validate(d){if(!d||typeof d.title!=='string'||!d.title.trim()||!Array.isArray(d.nodes)||d.nodes.length<1||d.nodes.length>100||!Array.isArray(d.edges)||d.edges.length>200||!Array.isArray(d.steps)||d.steps.length<1||d.steps.length>100)throw Error('项目格式或数量无效');const ids=new Set(),es=new Set();d.nodes.forEach(n=>{if(typeof n.id!=='string'||!n.id||ids.has(n.id)||typeof n.label!=='string'||!Number.isFinite(n.x)||!Number.isFinite(n.y)||n.x<0||n.x>940||n.y<0||n.y>560)throw Error('节点格式、坐标或 id 无效');ids.add(n.id)});d.edges.forEach(e=>{if(typeof e.id!=='string'||!e.id||es.has(e.id)||!ids.has(e.from)||!ids.has(e.to)||e.from===e.to)throw Error('连线引用或 id 无效');es.add(e.id)});let sum=0;d.steps.forEach(s=>{if(!Number.isFinite(s.duration)||s.duration<.2||s.duration>60||typeof s.caption!=='string'||!Array.isArray(s.nodes)||!Array.isArray(s.edges)||s.nodes.some(x=>!ids.has(x))||s.edges.some(x=>!es.has(x)))throw Error('步骤格式或引用无效');sum+=s.duration});if(sum>1800)throw Error('总时长超过 30 分钟');return d}
function render(){
 $('title').textContent=data.title;$('projectTitle').value=data.title;
 const stage=$('stage');stage.replaceChildren();stage.append(svg('rect',{width:1100,height:650,fill:'#101a2d',rx:12}));
 const defs=svg('defs'),marker=svg('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'});marker.append(svg('path',{d:'M0,0 L10,5 L0,10Z',fill:'#8cb6ff'}));defs.append(marker);stage.append(defs);
 const step=data.steps[currentStep()],activeN=new Set(step.nodes),activeE=new Set(step.edges);
 for(const e of data.edges){const a=data.nodes.find(n=>n.id===e.from),b=data.nodes.find(n=>n.id===e.to),dx=b.x-a.x,dy=b.y-a.y,r=Math.hypot(dx,dy)||1;stage.append(svg('line',{x1:a.x+80+dx/r*83,y1:a.y+32+dy/r*35,x2:b.x+80-dx/r*90,y2:b.y+32-dy/r*35,stroke:activeE.has(e.id)?'#77c5ff':'#4d6384','stroke-width':activeE.has(e.id)?5:2,'marker-end':'url(#arrow)',opacity:all||activeE.has(e.id)?1:.45}));}
 for(const n of data.nodes){const g=svg('g',{transform:`translate(${n.x},${n.y})`,cursor:'grab','data-node-id':n.id});g.append(svg('rect',{width:160,height:64,rx:12,fill:all||activeN.has(n.id)?'#244a86':'#1e2c44',stroke:n.id===selected?'#ffc979':activeN.has(n.id)?'#85c7ff':'#4a5c79','stroke-width':n.id===selected?3:2}));const label=svg('text',{x:80,y:37,'text-anchor':'middle',fill:'#eff6ff','font-size':14,'font-family':'sans-serif'},n.label.length>18?n.label.slice(0,17)+'…':n.label);g.append(label);g.append(svg('title',{},n.label));g.addEventListener('pointerdown',ev=>{playing=false;selected=n.id;const p=point(ev);drag={id:n.id,dx:p.x-n.x,dy:p.y-n.y};stage.setPointerCapture(ev.pointerId);render();refreshEditor();});stage.append(g)}
 $('caption').textContent=all?'全图预览':step.caption;$('seek').max=total();$('seek').value=seconds;$('time').textContent=`${seconds.toFixed(1)} / ${total().toFixed(1)} 秒`;$('mode').textContent=all?'全图':'步骤 '+(currentStep()+1);$('play').textContent=playing?'暂停':'播放';
 document.querySelectorAll('.step').forEach((e,i)=>e.classList.toggle('active',i===stepIndex));
}
function options(id,list,value){const el=$(id);el.replaceChildren();for(const [v,t] of list){const o=document.createElement('option');o.value=v;o.textContent=t;el.append(o)}el.value=value??list[0]?.[0]??''}
function refreshEditor(){const ns=data.nodes.map(n=>[n.id,n.id+' · '+n.label]);options('nodeSelect',ns,selected);options('fromNode',ns);options('toNode',ns,data.nodes[1]?.id);options('edgeSelect',data.edges.map(e=>[e.id,e.id+': '+e.from+' → '+e.to]));$('nodeLabel').value=data.nodes.find(n=>n.id===selected)?.label??'';$('steps').replaceChildren();data.steps.forEach((s,i)=>{const b=document.createElement('button');b.className='step'+(i===stepIndex?' active':'');b.textContent=(i+1)+'. '+s.caption.slice(0,32)+' · '+s.duration+'s';b.onclick=()=>{stepIndex=i;seconds=data.steps.slice(0,i).reduce((x,y)=>x+y.duration,0);playing=false;all=false;refreshEditor();render()};$('steps').append(b)});const s=data.steps[stepIndex];$('stepCaption').value=s.caption;$('duration').value=s.duration;$('stepNodes').value=JSON.stringify(s.nodes);$('stepEdges').value=JSON.stringify(s.edges);}
function point(ev){const p=$('stage').createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;return p.matrixTransform($('stage').getScreenCTM().inverse())}
$('stage').addEventListener('pointermove',ev=>{if(!drag)return;const n=data.nodes.find(n=>n.id===drag.id),p=point(ev);n.x=Math.max(0,Math.min(940,p.x-drag.dx));n.y=Math.max(0,Math.min(560,p.y-drag.dy));render()});$('stage').addEventListener('pointerup',()=>{drag=null});$('stage').addEventListener('pointercancel',()=>{drag=null});
$('nodeSelect').onchange=()=>{selected=$('nodeSelect').value;refreshEditor();render()};$('nodeLabel').oninput=()=>{data.nodes.find(n=>n.id===selected).label=$('nodeLabel').value;render()};$('projectTitle').oninput=()=>{data.title=$('projectTitle').value;$('title').textContent=data.title};
$('addNode').onclick=()=>{if(data.nodes.length>=100)return status('最多 100 个节点');let i=1;while(data.nodes.some(n=>n.id==='n'+i))i++;selected='n'+i;data.nodes.push({id:selected,label:'新节点',x:100+(i*90)%700,y:80+(i*70)%420});refreshEditor();render()};
$('deleteNode').onclick=()=>{if(data.nodes.length===1)return status('至少保留一个节点');data.nodes=data.nodes.filter(n=>n.id!==selected);const removed=new Set(data.edges.filter(e=>e.from===selected||e.to===selected).map(e=>e.id));data.edges=data.edges.filter(e=>!removed.has(e.id));data.steps.forEach(s=>{s.nodes=s.nodes.filter(n=>n!==selected);s.edges=s.edges.filter(e=>!removed.has(e))});selected=data.nodes[0].id;refreshEditor();render()};
$('addEdge').onclick=()=>{const a=$('fromNode').value,b=$('toNode').value;if(a===b)return status('请选择不同的起点与终点');if(data.edges.length>=200)return status('最多 200 条连线');let i=1;while(data.edges.some(e=>e.id==='e'+i))i++;data.edges.push({id:'e'+i,from:a,to:b});refreshEditor();render()};
$('deleteEdge').onclick=()=>{const id=$('edgeSelect').value;data.edges=data.edges.filter(e=>e.id!==id);data.steps.forEach(s=>s.edges=s.edges.filter(e=>e!==id));refreshEditor();render()};
$('addStep').onclick=()=>{if(data.steps.length>=100)return status('最多 100 步');data.steps.push({caption:'说明这个步骤',duration:3,nodes:[selected],edges:[]});stepIndex=data.steps.length-1;seconds=total()-data.steps[stepIndex].duration;playing=false;refreshEditor();render()};$('deleteStep').onclick=()=>{if(data.steps.length===1)return status('至少保留一个步骤');data.steps.splice(stepIndex,1);stepIndex=Math.min(stepIndex,data.steps.length-1);seconds=data.steps.slice(0,stepIndex).reduce((t,s)=>t+s.duration,0);playing=false;refreshEditor();render()};
$('saveStep').onclick=()=>{playing=false;try{const parse=id=>JSON.parse($(id).value),s={caption:$('stepCaption').value,duration:Number($('duration').value),nodes:parse('stepNodes'),edges:parse('stepEdges')};const candidate=structuredClone(data);candidate.steps[stepIndex]=s;validate(candidate);data=candidate;seconds=data.steps.slice(0,stepIndex).reduce((t,s)=>t+s.duration,0);refreshEditor();render();status('步骤已保存')}catch(e){status('步骤未保存：'+e.message);render()}};
$('play').onclick=()=>{if(seconds>=total())seconds=0;all=false;playing=!playing;last=performance.now();stepIndex=currentStep();refreshEditor();render()};$('reset').onclick=()=>{seconds=0;playing=false;all=false;stepIndex=0;refreshEditor();render()};$('showAll').onclick=()=>{all=!all;playing=false;render()};$('seek').oninput=()=>{seconds=Number($('seek').value);playing=false;all=false;stepIndex=currentStep();refreshEditor();render()};
$('exportJson').onclick=()=>{try{validate(data);download('figure-motion.json',JSON.stringify(data,null,2));status('JSON 已导出')}catch(e){status(e.message)}};$('exportSvg').onclick=()=>download('figure-motion.svg',new XMLSerializer().serializeToString($('stage')),'image/svg+xml');$('exportCaptions').onclick=()=>{let t=0;download('captions.txt',data.steps.map((s,i)=>{const l=`${i+1}. [${t.toFixed(1)}–${(t+s.duration).toFixed(1)}s] ${s.caption}`;t+=s.duration;return l}).join('\n\n'),'text/plain')};
$('importJson').onchange=async ev=>{try{const file=ev.target.files[0];if(!file)return;if(file.size>2e6)throw Error('文件不能超过 2 MB');const next=validate(JSON.parse(await file.text()));data=next;selected=data.nodes[0].id;stepIndex=0;seconds=0;playing=false;refreshEditor();render();status('已导入')}catch(e){status(e.message)}ev.target.value=''};
function tick(now){if(playing){seconds=Math.min(total(),seconds+(now-last)/1000);if(seconds>=total())playing=false;const next=currentStep();if(next!==stepIndex){stepIndex=next;refreshEditor()}render()}last=now;requestAnimationFrame(tick)}
document.querySelector('aside').addEventListener('focusin',()=>{if(playing){playing=false;render()}});
refreshEditor();render();requestAnimationFrame(tick);window.diagramStudio={getData:()=>structuredClone(data),validate,stepAt:currentStep};
</script></html>
